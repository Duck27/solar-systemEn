<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">Загрузка…</div>

    <aside id="planet-panel" class="planet-panel">
      <h2 id="planet-name" class="planet-panel__name"></h2>

      <div class="planet-carousel">
        <div class="planet-carousel__viewport">
          <div class="planet-carousel__track" id="carousel-track"></div>
        </div>

        <nav class="planet-carousel__nav" aria-label="Навигация по секциям">
          <button
            type="button"
            class="planet-carousel__btn"
            id="carousel-prev"
            aria-label="Предыдущая секция"
          >
            ‹
          </button>
          <div class="planet-carousel__dots" id="carousel-dots"></div>
          <button
            type="button"
            class="planet-carousel__btn"
            id="carousel-next"
            aria-label="Следующая секция"
          >
            ›
          </button>
        </nav>
      </div>
    </aside>

    <div id="simulation-clock-wrap" class="simulation-clock-wrap">
      <time id="simulation-clock" class="simulation-clock" datetime=""></time>
    </div>

    <nav id="speed-menu" class="speed-menu" aria-label="Скорость симуляции">
      <button type="button" class="speed-menu__btn" data-speed-mode="realtime">
        Реальное время
      </button>
      <button
        type="button"
        class="speed-menu__btn is-active"
        data-speed-mode="x1000"
      >
        ×1000
      </button>
      <button type="button" class="speed-menu__btn" data-speed-mode="x100000">
        ×100 000
      </button>

      <div class="speed-menu__divider" aria-hidden="true"></div>

      <div class="speed-menu__custom">
        <span class="speed-menu__prefix" aria-hidden="true">×</span>
        <input
          type="number"
          id="speed-custom"
          class="speed-menu__input"
          inputmode="decimal"
          step="any"
          aria-label="Произвольная скорость"
          title="Отрицательное значение — движение назад во времени"
        />
      </div>
      <button
        type="button"
        id="speed-reverse"
        class="speed-menu__reverse"
        aria-label="Обратить направление времени"
        title="Обратить направление"
      >
        ↺
      </button>
    </nav>

    <script src="./script.js" type="module"></script>
  </body>
</html>
